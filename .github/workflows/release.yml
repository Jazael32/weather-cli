name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(bun -e 'console.log(require("./package.json").version)')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Versión detectada: v${VERSION}"

      - name: Check if version is already released
        id: check
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/${VERSION}" | grep -q "${VERSION}"; then
            echo "La versión ${VERSION} ya fue publicada. Saltando release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.check.outputs.skip != 'true'
        run: bun test

      - name: Build binaries
        if: steps.check.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          bun build --compile --target=bun-windows-x64 src/index.ts --outfile "dist/weather-cli-v${VERSION}-windows-x64.exe"
          bun build --compile --target=bun-linux-x64 src/index.ts --outfile "dist/weather-cli-v${VERSION}-linux-x64"
          bun build --compile --target=bun-darwin-x64 src/index.ts --outfile "dist/weather-cli-v${VERSION}-darwin-x64"
          bun build --compile --target=bun-darwin-aarch64 src/index.ts --outfile "dist/weather-cli-v${VERSION}-darwin-aarch64"

      - name: Create release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "${VERSION}" dist/* \
            --title "${VERSION}" \
            --generate-notes \
            --target "${GITHUB_SHA}"
